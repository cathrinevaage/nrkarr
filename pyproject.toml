[project]
name = "nrkarr"
version = "0.1.0"
description = "Newznab indexer for NRK TV"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "pyyaml>=6.0",
]

[project.scripts]
nrkarr = "nrkarr.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
