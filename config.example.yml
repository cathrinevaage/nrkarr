server:
  host: 0.0.0.0
  port: 9121
  api_key: changeme
  url_base: ""            # when behind a reverse proxy, e.g. "/nrkarr"
  state: /config/known-series.json   # series Sonarr has had resolved, for RSS

# Resolves a tvdbid to the series' original (Norwegian) title, which is
# what NRK knows it as. TVDB and Sonarr hold the English title.
# A TMDB API Read Access Token; free, from themoviedb.org settings.
tmdb:
  api_key: ""

nrk:
  base_url: https://psapi.nrk.no
  timeout: 20

# What the job spec asks the download client for. Audio entries name a
# channel count; nrkarr resolves each to the matching group in NRK's HLS
# master per programme. Subtitles come from the master too (all three
# NRK tracks, with their names and flags), and synstolking from the
# <id>SYNS programme when it exists.
spec:
  container: mkv
  video:
    format: "bestvideo[height<=1080]"
  audio:
    - { channels: 6, title: "Norsk 5.1", language: nob, flags: [default], optional: true }
    - { channels: 2, title: "Norsk",     language: nob }
  described_audio:
    { channels: 2, title: "Synstolking", language: nob, flags: [visual_impaired], optional: true }
  forced_title_pattern: "kun ved annet språk"
  embed: [chapters, thumbnail, metadata]
  sidecar: []

release:
  group: Nrkarr
  source: NRK
  resolution: 1080p
  video_codec: H.264
  audio_codec: AAC2.0
  surround_audio_codec: DD5.1     # used when the first audio entry asks for 6 channels
  # Sonarr acts on the advertised size, so it has to be a real number.
  # yt-dlp reports ~15 Mbps for 1440p HEVC on NRK; 1080p AVC sits near
  # a third of that. Tune here if releases start failing size limits.
  bitrate_mbps: 5

cache:
  ttl: 300                # seconds; psapi is fast, this just spares it
